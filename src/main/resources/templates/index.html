<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список дел</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h1 class="text-center">Список дел</h1>
        <form th:action="@{/add}" th:object="${newTask}" method="post" class="mb-3">
            <div class="input-group">
                <input type="text" class="form-control" th:field="*{title}" placeholder="Добавить задачу">
                <button class="btn btn-danger" type="submit">Добавить</button>
            </div>
        </form>

        <form th:action="@{/removeAll}" method="post" class="text-center mb-4">
            <button class="btn btn-danger" type="submit">Удалить все задачи</button>
        </form>
    </div>
     <div class="container">
     <div class="row">
          <!-- Левый список -->
        <div class="col-md-4">
            <div class="text-center">
                <h2>Новые</h2>
            </div>
            <ul class="list-group list-group-flush bg-info text-white rounded">
                <li th:each="item : ${taskItems}" class="list-group-item bg-info text-white"
                    th:if="${item.status == 'To_Do'}">
                    <span th:text="${item.title}"></span>
                    <div class="d-flex justify-content-end">
                        <!-- Кнопка Сменить на В процесс -->
                        <form th:action="@{/changeInProgress/{id}(id=${item.id})}" method="post">
                            <button type="submit" class="btn btn-danger btn-sm me-2">Начать выполнение</button>
                        </form>
                        <!-- Кнопка удалить -->
                        <form th:action="@{/delete/{id}(id=${item.id})}" method="post">
                            <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>


        <!-- Центральный список -->
        <div class="col-md-4">
            <div class="text-center">
                <h2>В процессе выполнения</h2>
            </div>
            <ul class="list-group list-group-flush bg-info text-white rounded">
                <li th:each="item : ${taskItems}" class="list-group-item bg-info text-white"
                    th:if="${item.status == 'IN_PROGRESS'}">
                    <span th:text="${item.title}"></span>
                    <div class="d-flex justify-content-end">
                        <!-- Кнопка Сменить на Выполнить -->
                        <form th:action="@{/changeDone/{id}(id=${item.id})}" method="post">
                            <button type="submit" class="btn btn-danger btn-sm me-2">Выполнено</button>
                        </form>
                        <!-- Кнопка удалить -->
                        <form th:action="@{/delete/{id}(id=${item.id})}" method="post">
                            <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>

        <!-- Правый список -->
        <div class="col-md-4">
            <div class="text-center">
                <h2>Выполненные</h2>
            </div>
            <ul class="list-group list-group-flush bg-info text-white rounded">
                <li th:each="item : ${taskItems}" class="list-group-item bg-info text-white"
                    th:if="${item.status == 'Done'}">
                    <span th:text="${item.title}"></span>
                    <div class="d-flex justify-content-end">
                        <!-- Кнопка удалить -->
                        <form th:action="@{/delete/{id}(id=${item.id})}" method="post">
                            <button type="submit" class="btn btn-danger btn-sm ">Удалить</button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>
    </div>
    </div>

</body>
</html>
